[project]
name = "timestransfer"
version = "0.1.0"
description = "Minimal benchmark pipeline for time-series foundation model comparisons."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Jan Budziński", email = "jan.budzinski.stud@pw.edu.pl" },
]
dependencies = [
  "datasetsforecast>=1.0.0,<2.0.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=15.0,<23.0",
  "pyyaml>=6.0.1,<7.0",
  "scikit-learn>=1.4,<2.0",
  "statsforecast>=2.0,<3.0",
  "tabpfn>=8.0.8",
  "timesfm[torch]>=2.0.1",
  "matplotlib>=3.8,<4.0",
  "prophet>=1.1.6,<2.0",
  "chronos-forecasting>=1.4,<2.0",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
tabpfn = [
  "tabpfn>=8.0.8",
]
timesfm = [
  "timesfm[torch]>=2.0",
]
all = [
  "tabpfn>=8.0.8",
  "timesfm[torch]>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
